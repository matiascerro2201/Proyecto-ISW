spring.application.name=practicas-pedagogicas
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/practicas_pedagogicas?serverTimezone=UTC}
spring.datasource.username=${DB_USER:practicas_user}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.profiles.default=dev
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.data-locations=classpath:data.sql,classpath:data-documentos.sql

# HU-08: carpeta donde se guardan las entregas (fuera de static/).
# En despliegue se sobreescribe con la variable de entorno APP_UPLOADS_DIR.
app.uploads.dir=${APP_UPLOADS_DIR:./uploads}

# Límite de subida: Spring trae 1 MB por defecto y un PDF suele superarlo.
# El límite de la petición es un poco mayor para dejar margen a los campos del formulario.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# HU-10: cálculo de la calificación sugerida del informe final.
# Exigencia: % de logro que equivale a la nota 4,0 (escala 1,0 a 7,0).
app.informe.exigencia=60
# Puntaje máximo con que se evalúan los documentos (informes, productos y proyecto de intervención).
app.informe.puntaje-maximo-documento=100

# HU-26: límites del asistente (valores por defecto si no se definen)
chatbot.max-mensajes-por-dia=10
chatbot.max-caracteres-mensaje=1500
chatbot.max-intercambios-historial=6