spring.application.name=practicas-pedagogicas
spring.datasource.url=jdbc:mysql://localhost:3306/practicas_pedagogicas?serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.data-locations=classpath:data.sql,classpath:data-documentos.sql

# HU-08: carpeta donde se guardan las entregas (fuera de static/).
# En despliegue se sobreescribe con la variable de entorno APP_UPLOADS_DIR.
app.uploads.dir=${APP_UPLOADS_DIR:./uploads}

# Límite de subida: Spring trae 1 MB por defecto y un PDF suele superarlo.
# El límite de la petición es un poco mayor para dejar margen a los campos del formulario.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
