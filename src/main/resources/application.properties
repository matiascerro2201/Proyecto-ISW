spring.application.name=practicas-pedagogicas
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/practicas_pedagogicas?serverTimezone=UTC}
spring.datasource.username=${DB_USER:practicas_user}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8