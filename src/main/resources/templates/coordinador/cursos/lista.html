<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|Semestre ${semestre} de ${anio}|">Semestre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo-ubb.png}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/tema.css}">
    <link rel="stylesheet" th:href="@{/css/cursos.css}">
    <link rel="stylesheet" th:href="@{/css/lista-asignaturas.css}">
    <link rel="stylesheet" th:href="@{/css/coordinador.css}">
    <script th:src="@{/js/coordinador.js}" defer></script>
</head>
<body>
<th:block th:replace="~{fragments/barra :: barra('/coordinador/cursos')}"></th:block>
<main>
    <a class="back-link" th:href="@{/coordinador/cursos}">Volver a los semestres</a>

    <h1 th:text="|Semestre ${semestre} de ${anio}|">Semestre 2 de 2026</h1>

    <form class="coord-filtros" method="get" role="search"
          th:action="@{/coordinador/cursos/semestre/{anio}/{semestre}(anio=${anio}, semestre=${semestre})}">
        <label class="coord-filtros__buscar">
            Buscar
            <input type="search" name="q" th:value="${q}" placeholder="Asignatura o profesor" autocomplete="off">
        </label>
        <label>
            Ciclo
            <select name="ciclo">
                <option value="">Todos</option>
                <option th:each="c : ${ciclos}" th:value="${c}" th:selected="${ciclo == c}"
                        th:text="${#strings.capitalize(#strings.toLowerCase(c))}">Final</option>
            </select>
        </label>
        <button type="submit" class="btn btn-primary">Buscar</button>
        <a class="btn btn-ghost" th:href="@{/coordinador/cursos/semestre/{anio}/{semestre}(anio=${anio}, semestre=${semestre})}">Limpiar</a>
    </form>

    <p class="coord-contador" aria-live="polite"
       th:text="|${#lists.size(cursos)} ${#lists.size(cursos) == 1 ? 'curso' : 'cursos'}|">3 cursos</p>

    <p class="vacio" th:if="${#lists.isEmpty(cursos)}">No hay cursos que coincidan con la búsqueda.</p>

    <ul class="coord-lista" th:unless="${#lists.isEmpty(cursos)}">
        <li th:each="c : ${cursos}">
            <a class="coord-fila" th:href="@{${c.enlace()}}">
                <span class="coord-fila__principal">
                    <span class="coord-fila__titulo" th:text="${c.nombre()}">Práctica Pedagógica</span>
                    <span class="coord-fila__sub" th:text="|Profesor: ${c.profesor()}|">Profesor: Víctor Parra</span>
                </span>
                <span class="coord-fila__dato" th:text="|Ciclo ${c.cicloEtiqueta().toLowerCase()}|">Ciclo final</span>
                <span class="coord-fila__dato"
                      th:text="|${c.estudiantes()} ${c.estudiantes() == 1 ? 'estudiante' : 'estudiantes'}|">12 estudiantes</span>
                <span class="coord-fila__dato"
                      th:text="|${c.informesPublicados()} de ${c.estudiantes()} informes publicados|">3 de 12 informes publicados</span>
            </a>
        </li>
    </ul>
</main>
</body>
</html>
