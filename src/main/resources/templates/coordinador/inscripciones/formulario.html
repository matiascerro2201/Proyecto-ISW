<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inscripción · Coordinación</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo-ubb.png}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/tema.css}">
    <link rel="stylesheet" th:href="@{/css/cursos.css}">
    <link rel="stylesheet" th:href="@{/css/lista-asignaturas.css}">
    <link rel="stylesheet" th:href="@{/css/coordinador.css}">
    <script th:src="@{/js/coordinador.js}" defer></script>
</head>
<body>
<th:block th:replace="~{fragments/barra :: barra('/coordinador/secciones')}"></th:block>
<main>
    <a class="back-link" th:href="@{/coordinador/semestre/{id}/inscripciones(id=${seccion.id()})}">Volver a inscripciones</a>
    <h1 th:text="${editando} ? 'Editar inscripción' : 'Inscribir estudiante'">Inscribir estudiante</h1>
    <p class="coord-sub" th:text="${seccion.titulo()}">Práctica Pedagógica · Semestre 2 de 2026</p>

    <div class="coord-error" role="alert" th:if="${errores}">
        <p th:each="e : ${errores}" th:text="${e}">Error</p>
    </div>

    <form class="coord-formulario" method="post" th:object="${formulario}"
          th:action="${editando} ? @{/coordinador/semestre/{s}/inscripciones/{i}(s=${seccion.id()},i=${idInscripcion})} : @{/coordinador/semestre/{s}/inscripciones(s=${seccion.id()})}">

        <p th:if="${editando}"><strong>Estudiante:</strong> <span th:text="${estudianteActual}">Nombre</span></p>
        <label th:unless="${editando}">Estudiante
            <select th:field="*{idEstudiante}" required>
                <option value="">Elige un estudiante</option>
                <option th:each="e : ${estudiantes}" th:value="${e.id()}" th:text="${e.etiqueta()}">Estudiante</option>
            </select>
        </label>
        <p class="coord-sub" th:if="${!editando and #lists.isEmpty(estudiantes)}">
            No quedan estudiantes activos sin inscribir en esta sección.
        </p>

        <label>Centro de práctica
            <select th:field="*{idCentro}" required>
                <option value="">Elige un centro</option>
                <option th:each="c : ${centros}" th:value="${c.id()}" th:text="${c.etiqueta()}">Centro</option>
            </select>
        </label>

        <fieldset th:each="linea, st : *{lineas}">
            <legend th:text="|Línea: ${linea.etiquetaTipo()}|">Línea</legend>
            <input type="hidden" th:field="*{lineas[__${st.index}__].tipo}">
            <label>Profesor colaborador
                <select th:field="*{lineas[__${st.index}__].idColaborador}" required>
                    <option value="">Elige un colaborador</option>
                    <option th:each="c : ${colaboradores}" th:value="${c.id()}" th:text="${c.etiqueta()}">Colaborador</option>
                </select>
            </label>
            <label>Tutor (opcional)
                <select th:field="*{lineas[__${st.index}__].idTutor}">
                    <option value="">Sin tutor</option>
                    <option th:each="t : ${tutores}" th:value="${t.id()}" th:text="${t.etiqueta()}">Tutor</option>
                </select>
            </label>
        </fieldset>

        <div class="coord-formulario__acciones">
            <button type="submit" class="btn btn-primary" th:text="${editando} ? 'Guardar cambios' : 'Inscribir'">Guardar</button>
            <a class="btn btn-ghost" th:href="@{/coordinador/semestre/{id}/inscripciones(id=${seccion.id()})}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
