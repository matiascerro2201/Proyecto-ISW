<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${estudiante.nombre()}">Estudiante</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo-ubb.png}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/tema.css}">
    <link rel="stylesheet" th:href="@{/css/cursos.css}">
    <link rel="stylesheet" th:href="@{/css/lista-asignaturas.css}">
    <link rel="stylesheet" th:href="@{/css/coordinador.css}">
    <script th:src="@{/js/coordinador.js}" defer></script>
</head>
<body>
<th:block th:replace="~{fragments/barra :: barra('/coordinador/estudiantes')}"></th:block>
<main>
    <a class="back-link" th:href="@{/coordinador/estudiantes}">Volver a los estudiantes</a>
    <div th:fragment="contenido">
        <h3 class="coord-dialogo__nombre" th:text="${estudiante.nombre()}">Nombre</h3>
        <p class="coord-sub" th:text="|${estudiante.email()} · ${estudiante.carrera()}${estudiante.activo() ? '' : ' · Cuenta inactiva'}|">correo</p>
        <p class="vacio" th:if="${#lists.isEmpty(estudiante.cursos())}">Este estudiante no está inscrito en ningún curso.</p>
        <div class="coord-acordeon" th:unless="${#lists.isEmpty(estudiante.cursos())}">
            <th:block th:each="a : ${estudiante.cursos()}">
                <th:block th:replace="~{fragments/coordinador-actividad :: inscripcion(${a}, true)}"></th:block>
            </th:block>
        </div>
    </div>
</main>
</body>
</html>
