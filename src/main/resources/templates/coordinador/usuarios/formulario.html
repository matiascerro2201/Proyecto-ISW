<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${editando} ? 'Editar cuenta' : 'Nueva cuenta'">Cuenta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo-ubb.png}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/tema.css}">
    <link rel="stylesheet" th:href="@{/css/cursos.css}">
    <link rel="stylesheet" th:href="@{/css/lista-asignaturas.css}">
    <link rel="stylesheet" th:href="@{/css/coordinador.css}">
    <script th:src="@{/js/coordinador.js}" defer></script>
</head>
<body>
<th:block th:replace="~{fragments/barra :: barra('/coordinador/usuarios')}"></th:block>
<main>
    <a class="back-link" th:href="@{/coordinador/usuarios}">Volver a usuarios</a>
    <h1 th:text="${editando} ? 'Editar cuenta' : 'Nueva cuenta'">Nueva cuenta</h1>

    <p class="coord-error" role="alert" th:if="${error}" th:text="${error}"></p>

    <form class="coord-formulario" method="post"
          th:action="${editando} ? @{/coordinador/usuarios/{id}(id=${idUsuario})} : @{/coordinador/usuarios}"
          th:object="${formulario}">
        <label>Nombre
            <input type="text" th:field="*{nombre}" maxlength="150" required>
        </label>
        <label>Correo
            <input type="email" th:field="*{email}" maxlength="150" required autocomplete="off">
        </label>
        <label>Rol
            <select th:field="*{rol}" id="campo-rol" required th:disabled="${propia}">
                <option value="">Elige un rol</option>
                <option th:each="r : ${roles}" th:value="${r.valor()}" th:text="${r.etiqueta()}">Rol</option>
            </select>
        </label>
        <input type="hidden" name="rol" th:if="${propia}" th:value="*{rol}">
        <p class="coord-sub" th:if="${propia}">No puedes cambiar tu propio rol.</p>

        <label data-solo-rol="ESTUDIANTE">Carrera
            <input type="text" th:field="*{carrera}" maxlength="150">
        </label>
        <label data-solo-rol="COLABORADOR">Centro de práctica
            <select th:field="*{idCentro}">
                <option value="">Elige un centro</option>
                <option th:each="c : ${centros}" th:value="${c.id()}" th:text="${c.etiqueta()}">Centro</option>
            </select>
        </label>
        <label>
            <span th:text="${editando} ? 'Nueva contraseña (déjala vacía para mantener la actual)' : 'Contraseña inicial'">Contraseña</span>
            <input type="password" th:field="*{password}" minlength="8" autocomplete="new-password" th:required="${!editando}">
        </label>

        <div class="coord-formulario__acciones">
            <button type="submit" class="btn btn-primary" th:text="${editando} ? 'Guardar cambios' : 'Crear cuenta'">Guardar</button>
            <a class="btn btn-ghost" th:href="@{/coordinador/usuarios}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
