<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Evaluación de la pauta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo-ubb.png}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/evaluacion.css}">
</head>
<body>
<img class="brand-logo" th:src="@{/images/logo-ubb.png}" alt="Universidad del Bío-Bío" width="498" height="304">
<main>
    <a class="back-link" th:href="@{/colaborador/lineas/{id}(id=${form.idLinea})}">Volver a las pautas del estudiante</a>

    <h1 th:text="${form.edicion} ? 'Editar evaluación' : 'Evaluar con la pauta'">Evaluar con la pauta</h1>
    <p>
        <strong th:text="${form.nombreEstudiante}">Estudiante Uno</strong><br>
        <span th:text="${form.nombreAsignatura}">Práctica Pedagógica</span> ·
        <span th:switch="${form.tipoLinea}">
            <span th:case="'UNICA'">Línea única</span>
            <span th:case="'ESPECIALIDAD'">Especialidad</span>
            <span th:case="'ORIENTACION'">Orientación</span>
            <span th:case="*" th:text="${form.tipoLinea}">Línea</span>
        </span> ·
        <span th:text="|Aplicación ${form.numeroAplicacion}|">Aplicación 1</span>
    </p>

    <!-- Errores de validación: todos juntos, para corregir de una vez -->
    <div class="alerta" role="alert" th:if="${errores != null and !#lists.isEmpty(errores)}">
        <strong>No se pudo guardar la evaluación:</strong>
        <ul>
            <li th:each="error : ${errores}" th:text="${error}">Falta el puntaje de ...</li>
        </ul>
    </div>

    <!-- th:action agrega automáticamente el token CSRF -->
    <form th:action="@{/colaborador/lineas/{l}/pautas/{p}(l=${form.idLinea}, p=${form.idPautaEvaluacion})}" method="post">

        <section th:each="dimension : ${form.dimensiones}">
            <h2 th:text="${dimension.nombre}">Dimensión</h2>

            <div class="criterio" th:each="criterio : ${dimension.criterios}">
                <p th:text="${criterio.descripcion}">Descripción del criterio</p>

                <label>
                    Puntaje (máximo <span th:text="${#numbers.formatDecimal(criterio.puntajeMax, 1, 'POINT', 2, 'COMMA')}">4,00</span>)
                    <input type="number" step="0.01" min="0" required
                           th:max="${criterio.puntajeMax}"
                           th:name="|puntaje_${criterio.idCriterio}|"
                           th:value="${criterio.puntaje}">
                </label>

                <label>
                    Comentario (opcional, solo texto)
                    <textarea rows="2"
                              th:name="|comentario_${criterio.idCriterio}|"
                              th:text="${criterio.comentario}"></textarea>
                </label>
            </div>
        </section>

        <p>
            <button type="submit" class="btn btn-primary"
                    th:text="${form.edicion} ? 'Guardar cambios' : 'Guardar evaluación'">Guardar evaluación</button>
        </p>
    </form>
</main>
</body>
</html>
