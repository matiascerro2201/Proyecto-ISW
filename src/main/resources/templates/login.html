<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión · Prácticas Pedagógicas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo-ubb.png}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/tema.css(v=2)}">
    <link rel="stylesheet" th:href="@{/css/login.css(v=2)}">
    <script th:src="@{/js/login.js(v=2)}" defer></script>
</head>
<body class="login">
<div class="login__layout">
    <aside class="login__lateral">
        <span class="login__logo">
            <img th:src="@{/images/logo-ubb.png}" alt="Universidad del Bío-Bío" width="498" height="304">
        </span>
        <div class="login__texto">
            <h2>Prácticas Pedagógicas, en un solo lugar.</h2>
            <p>Planificaciones, evaluaciones e informes de la práctica, siempre a mano.</p>
        </div>
    </aside>

    <main class="login__principal">
        <div class="login__caja">
            <h1>Iniciar sesión</h1>
            <p class="login__sub">Ingresa con tu cuenta institucional.</p>

            <p class="msg error" role="alert" th:if="${param.error}">Correo o contraseña incorrectos.</p>
            <p class="msg ok" th:if="${param.logout}">Sesión cerrada correctamente.</p>

            <form th:action="@{/login}" method="post">
                <div class="field">
                    <label for="username">Correo</label>
                    <input id="username" type="email" name="username" autocomplete="username" required autofocus>
                </div>
                <div class="field">
                    <label for="password">Contraseña</label>
                    <div class="clave">
                        <input id="password" type="password" name="password" autocomplete="current-password" required>
                        <button type="button" class="clave__ver" id="ver-clave" aria-pressed="false" aria-label="Mostrar contraseña" hidden>Mostrar</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Ingresar</button>
            </form>
        </div>
    </main>
</div>
</body>
</html>
