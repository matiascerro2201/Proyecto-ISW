<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle de la entrega</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo-ubb.png}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/tema.css}">
    <link rel="stylesheet" th:href="@{/css/cursos.css}">
    <link rel="stylesheet" th:href="@{/css/lista-asignaturas.css}">
    <link rel="stylesheet" th:href="@{/css/coordinador.css}">
    <script th:src="@{/js/coordinador.js}" defer></script>
</head>
<body>
<th:block th:replace="~{fragments/barra :: barra('/estudiante/evaluaciones')}"></th:block>
<main>
    <a class="back-link" th:href="@{/estudiante/evaluaciones}">Volver a mis evaluaciones</a>
    <h1 th:text="${detalle.nombre()}">Entrega</h1>
    <p class="coord-sub" th:text="|${detalle.asignatura()} · ${detalle.periodo()}|">Asignatura · Semestre</p>

    <p class="coord-contador" th:text="|Nota: ${detalle.nota().toPlainString().replace('.', ',')} · Ponderación: ${detalle.ponderacion().stripTrailingZeros().toPlainString()} %|">Nota: 6,0</p>
    <p class="card__meta" th:if="${detalle.fechaLimite() != null}" th:text="|Fecha límite: ${#temporals.format(detalle.fechaLimite(), 'dd/MM/yyyy')}|">Fecha límite</p>
    <p class="card__meta" th:if="${detalle.entregadaEl() != null}" th:text="|Entregada el ${#temporals.format(detalle.entregadaEl(), 'dd/MM/yyyy HH:mm')}|">Entregada</p>
    <p class="card__meta" th:if="${detalle.automatica()}">Nota automática: no se recibió la entrega dentro del plazo.</p>

    <article class="card">
        <h3>Comentario del profesor</h3>
        <p th:if="${detalle.comentario() != null}" th:text="${detalle.comentario()}">Comentario</p>
        <p class="vacio" th:if="${detalle.comentario() == null}">El profesor no dejó un comentario.</p>
    </article>
</main>
</body>
</html>
