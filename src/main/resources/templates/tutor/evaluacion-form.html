<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Evaluación de la pauta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo-ubb.png}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/evaluacion.css}">
</head>
<body>
<img class="brand-logo" th:src="@{/images/logo-ubb.png}" alt="Universidad del Bío-Bío" width="498" height="304">
<main>
    <a class="back-link" th:href="@{/tutor/lineas/{id}(id=${form.idLinea})}">Volver a las pautas del estudiante</a>

    <h1 th:text="${form.edicion} ? 'Editar evaluación' : 'Evaluar con la pauta'">Evaluar con la pauta</h1>
    <p>
        <strong th:text="${form.nombreEstudiante}">Estudiante Uno</strong><br>
        <span th:text="${form.nombreAsignatura}">Práctica Pedagógica</span> ·
        <span th:switch="${form.tipoLinea}">
            <span th:case="'UNICA'">Línea única</span>
            <span th:case="'ESPECIALIDAD'">Especialidad</span>
            <span th:case="'ORIENTACION'">Orientación</span>
            <span th:case="*" th:text="${form.tipoLinea}">Línea</span>
        </span> ·
        <span th:text="|Aplicación ${form.numeroAplicacion}|">Aplicación 1</span>
    </p>

    <!-- Errores de validación: todos juntos, para corregir de una vez -->
    <div class="alerta" role="alert" th:if="${errores != null and !#lists.isEmpty(errores)}">
        <strong>No se pudo guardar la evaluación:</strong>
        <ul>
            <li th:each="error : ${errores}" th:text="${error}">Falta el puntaje de ...</li>
        </ul>
    </div>

    <!-- th:action agrega automáticamente el token CSRF -->
    <form th:action="@{/tutor/lineas/{l}/pautas/{p}(l=${form.idLinea}, p=${form.idPautaEvaluacion})}" method="post">

        <section th:each="dimension : ${form.dimensiones}">
            <h2 th:text="${dimension.nombre}">Dimensión</h2>

            <div class="criterio" th:each="criterio : ${dimension.criterios}">
                <p th:text="${criterio.descripcion}">Descripción del criterio</p>

                <label>
                    Puntaje (máximo <span th:text="${#numbers.formatDecimal(criterio.puntajeMax, 1, 'POINT', 2, 'COMMA')}">4,00</span>)
                    <input type="number" step="0.01" min="0" required
                           th:max="${criterio.puntajeMax}"
                           th:name="|puntaje_${criterio.idCriterio}|"
                           th:value="${criterio.puntaje}">
                </label>

                <div class="campo-comentario">
                    <div class="comentario-header">
                        <label th:for="|comentario_${criterio.idCriterio}|">
                            Comentario (opcional, puedes escribir o dictar)
                        </label>
                        <button type="button" class="btn-voz"
                                th:attr="data-target=|comentario_${criterio.idCriterio}|"
                                title="Insertar nota de voz convertida a texto">
                            Dictar nota de voz
                        </button>
                    </div>
                    <textarea rows="2"
                              th:id="|comentario_${criterio.idCriterio}|"
                              th:name="|comentario_${criterio.idCriterio}|"
                              th:text="${criterio.comentario}"></textarea>
                </div>
            </div>
        </section>

        <p>
            <button type="submit" class="btn btn-primary"
                    th:text="${form.edicion} ? 'Guardar cambios' : 'Guardar evaluación'">Guardar evaluación</button>
        </p>
    </form>
</main>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const botonesVoz = document.querySelectorAll('.btn-voz');

    if (!SpeechRecognition) {
        console.warn('El navegador actual no soporta Web Speech API.');
        botonesVoz.forEach(boton => boton.style.display = 'none');
        return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = 'es-CL';
    recognition.continuous = true; 
    recognition.interimResults = true; 

    let textareaActivo = null;
    let botonActivo = null;
    let grabacionActivaPorUsuario = false;
    let textoConsolidado = '';

    function aplicarPuntuacionYFormato(texto) {
        let procesado = texto
            .replace(/\s+punto y coma/gi, ';')
            .replace(/\s+punto aparte/gi, '.\n')
            .replace(/\s+nueva l[ií]nea/gi, '\n')
            .replace(/\s+dos puntos/gi, ':')
            .replace(/\s+coma/gi, ',')
            .replace(/\s+punto/gi, '.')
            .replace(/\s+abrir interrogaci[oó]n/gi, ' ¿')
            .replace(/\s+cerrar interrogaci[oó]n/gi, '?')
            .replace(/\s+signo de interrogaci[oó]n/gi, '?')
            .replace(/\s+abrir exclamaci[oó]n/gi, ' ¡')
            .replace(/\s+cerrar exclamaci[oó]n/gi, '!');

        procesado = procesado.replace(/([.,;:?!])(?=[a-zA-ZáéíóúÁÉÍÓÚñÑ¿¡])/g, '$1 ');
        procesado = procesado.replace(/[ ]{2,}/g, ' ');

        procesado = procesado.replace(/(^\s*[a-záéíóúñ]|[.?!]\s+[a-záéíóúñ]|\n\s*[a-záéíóúñ])/g, (match) => {
            return match.toUpperCase();
        });

        return procesado;
    }

    function detenerGrabacion() {
        grabacionActivaPorUsuario = false;
        recognition.stop();
        if (botonActivo) {
            botonActivo.classList.remove('grabando');
            botonActivo.textContent = 'Dictar nota de voz';
        }
        botonActivo = null;
        textareaActivo = null;
    }

    botonesVoz.forEach(boton => {
        boton.addEventListener('click', () => {
            const targetId = boton.getAttribute('data-target');
            const textarea = document.getElementById(targetId);

            if (grabacionActivaPorUsuario && botonActivo === boton) {
                detenerGrabacion();
                return;
            }

            if (grabacionActivaPorUsuario) {
                detenerGrabacion();
            }

            textareaActivo = textarea;
            botonActivo = boton;
            textoConsolidado = textareaActivo.value.trim();
            grabacionActivaPorUsuario = true;

            recognition.start();
        });
    });

    recognition.addEventListener('start', () => {
        if (botonActivo) {
            botonActivo.classList.add('grabando');
            botonActivo.textContent = 'Detener dictado';
        }
    });

    recognition.addEventListener('result', (event) => {
        if (!textareaActivo) return;

        let textoInterino = '';

        for (let i = event.resultIndex; i < event.results.length; i++) {
            const transcripcion = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
                const separador = (textoConsolidado && !textoConsolidado.endsWith('\n')) ? ' ' : '';
                textoConsolidado = aplicarPuntuacionYFormato(textoConsolidado + separador + transcripcion.trim());
            } else {
                textoInterino += transcripcion;
            }
        }

        const separadorInterino = (textoConsolidado && textoInterino) ? ' ' : '';
        textareaActivo.value = aplicarPuntuacionYFormato(textoConsolidado + separadorInterino + textoInterino);
        textareaActivo.scrollTop = textareaActivo.scrollHeight;
    });

    recognition.addEventListener('error', (event) => {
        if (event.error === 'no-speech') {
            return;
        }
        console.error('Error en reconocimiento de voz:', event.error);
        if (event.error === 'not-allowed') {
            alert('Debes permitir el acceso al micrófono en tu navegador para dictar notas de voz.');
            detenerGrabacion();
        }
    });

    recognition.addEventListener('end', () => {
        if (grabacionActivaPorUsuario) {
            textoConsolidado = textareaActivo ? textareaActivo.value.trim() : textoConsolidado;
            try {
                recognition.start();
            } catch (e) {
            }
        }
    });
});
</script>
</body>
</html>
