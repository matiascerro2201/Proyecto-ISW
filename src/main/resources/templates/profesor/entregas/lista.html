<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entregas de mis estudiantes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo-ubb.png}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/tema.css}">
    <link rel="stylesheet" th:href="@{/css/cursos.css}">
    <link rel="stylesheet" th:href="@{/css/lista-asignaturas.css}">
    <link rel="stylesheet" th:href="@{/css/coordinador.css}">
    <script th:src="@{/js/coordinador.js}" defer></script>
</head>
<body>
<th:block th:replace="~{fragments/barra :: barra('/profesor/entregas')}"></th:block>
<main>
    <a class="back-link" th:href="@{/}">Volver al inicio</a>
    <h1>Entregas de mis estudiantes</h1>
    <p class="coord-sub">Se muestran los semestres que ya fueron iniciados por el coordinador.</p>

    <p class="vacio" th:if="${#lists.isEmpty(secciones)}">Todavía no tienes semestres iniciados.</p>
    <table class="coord-tabla" th:unless="${#lists.isEmpty(secciones)}">
        <thead><tr><th>Asignatura</th><th>Semestre</th><th>Acciones</th></tr></thead>
        <tbody>
        <tr th:each="s : ${secciones}">
            <td th:text="${s.asignatura()}">Asignatura</td>
            <td th:text="${s.periodo()}">Semestre 2 de 2026</td>
            <td class="coord-acciones">
                <a class="btn btn-ghost" th:href="@{/profesor/entregas/{id}(id=${s.id()})}">Ver entregas</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
