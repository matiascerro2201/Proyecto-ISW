<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pautas de evaluación</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo-ubb.png}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/tema.css}">
    <link rel="stylesheet" th:href="@{/css/cursos.css}">
    <link rel="stylesheet" th:href="@{/css/lista-asignaturas.css}">
    <script th:src="@{/js/lista-asignaturas.js}" defer></script>
</head>
<body>
<th:block th:replace="~{fragments/barra :: barra('/profesor/pautas')}"></th:block>
<main>
    <a class="back-link" th:href="@{/}">Volver al inicio</a>

    <h1>Pautas de evaluación</h1>
    <p>
        Define las pautas de tus asignaturas. Colaboradores y tutores las completan desde el sistema.
    </p>

    <p class="msg ok" th:if="${mensaje}" th:text="${mensaje}"></p>
    <p class="msg error" th:if="${error}" th:text="${error}"></p>

    <section class="asignaturas" aria-labelledby="titulo-asignaturas">
        <div class="asignaturas__cab">
            <h2 id="titulo-asignaturas">Asignaturas</h2>
            <span class="asignaturas__contador" id="contador" aria-live="polite"
                  th:text="|${#lists.size(asignaturas)} ${#lists.size(asignaturas) == 1 ? 'asignatura' : 'asignaturas'}|">2 asignaturas</span>
        </div>

        <p class="vacio" th:if="${#lists.isEmpty(asignaturas)}">No tienes asignaturas asignadas, por lo que aún no puedes definir pautas.</p>

        <th:block th:unless="${#lists.isEmpty(asignaturas)}">
            <div class="filtros" style="--filtros: 1;" role="search">
                <div class="filtros__buscar">
                    <label for="buscar">Buscar</label>
                    <div class="sugerencias">
                        <input type="search" id="buscar" placeholder="Nombre de la asignatura" autocomplete="off"
                               role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sugerencias">
                        <ul class="sugerencias__lista" id="sugerencias" role="listbox" aria-label="Sugerencias de asignaturas" hidden></ul>
                    </div>
                </div>
                <label>
                    Ponderaciones
                    <select id="filtro-estado">
                        <option value="">Todas</option>
                        <option value="COMPLETA">Completas (100 %)</option>
                        <option value="INCOMPLETA">Faltan puntos para 100 %</option>
                        <option value="EXCEDIDA">Exceden 100 %</option>
                        <option value="SIN_PAUTAS">Sin pautas</option>
                    </select>
                </label>
                <button type="button" class="btn btn-ghost" id="limpiar-filtros">Limpiar</button>
            </div>

            <ul class="asignaturas__lista" id="lista-asignaturas" style="--datos: 2;" data-hash="asignatura">
                <li class="asignatura" th:each="asignatura : ${asignaturas}"
                    th:with="estado=${#lists.isEmpty(asignatura.pautas()) ? 'SIN_PAUTAS' : (asignatura.excedido() ? 'EXCEDIDA' : (asignatura.incompleto() ? 'INCOMPLETA' : 'COMPLETA'))}"
                    th:attr="data-estado=${estado}">
                    <button type="button" class="asignatura__fila" aria-haspopup="dialog"
                            th:attr="data-id=${asignatura.idAsignatura()}">
                        <span class="asignatura__principal">
                            <span class="asignatura__nombre" th:text="${asignatura.nombre()}">Práctica Pedagógica</span>
                        </span>
                        <span class="asignatura__dato"
                              th:text="|${#lists.size(asignatura.pautas())} ${#lists.size(asignatura.pautas()) == 1 ? 'pauta' : 'pautas'}|">3 pautas</span>
                        <span class="asignatura__dato"
                              th:text="${asignatura.tieneTotal()
                                         ? 'Total ' + #numbers.formatDecimal(asignatura.totalPonderacion(), 1, 'POINT', 2, 'COMMA') + ' de 100 %'
                                         : 'Sin ponderaciones'}">Total 73,00 de 100 %</span>
                        <span th:switch="${estado}">
                            <span class="badge borrador" th:case="'SIN_PAUTAS'">Sin pautas</span>
                            <span class="badge rechazada" th:case="'EXCEDIDA'">Excede 100 %</span>
                            <span class="badge pendiente" th:case="'INCOMPLETA'"
                                  th:text="|Faltan ${#numbers.formatDecimal(asignatura.faltante(), 1, 'POINT', 2, 'COMMA')} %|">Faltan 27,00 %</span>
                            <span class="badge aprobada" th:case="*">Completa</span>
                        </span>
                    </button>
                </li>
            </ul>
            <p class="vacio" id="sin-resultados" hidden>Ninguna asignatura coincide con la búsqueda.</p>

            <template th:each="asignatura : ${asignaturas}" th:id="|plantilla-${asignatura.idAsignatura()}|">
                <div class="pautas-cab">
                    <p th:if="${asignatura.tieneTotal()}">
                        <strong>Total de la asignatura:</strong>
                        <span th:text="|${#numbers.formatDecimal(asignatura.totalPonderacion(), 1, 'POINT', 2, 'COMMA')} de 100 %|">73,00 de 100 %</span>
                    </p>
                    <a class="btn btn-primary btn-grande"
                       th:href="@{/profesor/pautas/nueva(asignatura=${asignatura.idAsignatura()})}">Nueva pauta</a>
                </div>

                <p class="msg" th:if="${asignatura.incompleto()}"
                   th:text="|Aviso: faltan ${#numbers.formatDecimal(asignatura.faltante(), 1, 'POINT', 2, 'COMMA')} % para llegar a 100. No impide guardar: puede que falte cargar otras pautas de evaluación o de documento.|">
                    Aviso: faltan 27,00 % para llegar a 100.
                </p>
                <p class="msg error" th:if="${asignatura.excedido()}">
                    Las ponderaciones de esta asignatura suman más de 100 %. Revisa las pautas de evaluación y de documento.
                </p>

                <p class="vacio" th:if="${#lists.isEmpty(asignatura.pautas())}">Esta asignatura aún no tiene pautas.</p>

                <div class="tabla-scroll" th:unless="${#lists.isEmpty(asignatura.pautas())}">
                    <table>
                        <caption class="sr-only">Pautas de la asignatura</caption>
                        <thead>
                            <tr>
                                <th scope="col">Tipo de línea</th>
                                <th scope="col">Aplicación</th>
                                <th scope="col">Ponderación</th>
                                <th scope="col">Criterios</th>
                                <th scope="col">Estado</th>
                                <th scope="col"><span class="sr-only">Acción</span></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="pauta : ${asignatura.pautas()}">
                                <td th:text="${pauta.tipoLinea()}">UNICA</td>
                                <td th:text="${pauta.numeroAplicacion()}">1</td>
                                <td th:text="|${#numbers.formatDecimal(pauta.ponderacion(), 1, 'POINT', 2, 'COMMA')} %|">30,00 %</td>
                                <td th:text="${pauta.cantidadCriterios()}">8</td>
                                <td th:text="${pauta.enUso() ? 'En uso (solo lectura)' : 'Editable'}">Editable</td>
                                <td>
                                    <a class="btn btn-ghost"
                                       th:href="@{/profesor/pautas/{id}/editar(id=${pauta.idPauta()})}"
                                       th:text="${pauta.enUso() ? 'Ver' : 'Editar'}">Editar</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </template>
        </th:block>
    </section>
    <noscript><p class="alerta">Esta página necesita JavaScript para mostrar las pautas de cada asignatura.</p></noscript>
</main>

<dialog class="dialogo dialogo--pautas" id="dialogo-lista" aria-labelledby="dialogo-lista-titulo">
    <div class="dialogo__cab">
        <h2 id="dialogo-lista-titulo">Pautas</h2>
        <button type="button" class="dialogo__cerrar" id="dialogo-lista-cerrar" aria-label="Cerrar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
    </div>
    <div class="dialogo__cuerpo" id="dialogo-lista-cuerpo"></div>
</dialog>
</body>
</html>
