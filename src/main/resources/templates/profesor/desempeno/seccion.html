<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estudiantes del semestre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo-ubb.png}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/tema.css}">
    <link rel="stylesheet" th:href="@{/css/cursos.css}">
    <link rel="stylesheet" th:href="@{/css/lista-asignaturas.css}">
    <link rel="stylesheet" th:href="@{/css/coordinador.css}">
    <script th:src="@{/js/coordinador.js}" defer></script>
</head>
<body>
<th:block th:replace="~{fragments/barra :: barra('/profesor/desempeno')}"></th:block>
<main>
    <a class="back-link" th:href="@{/profesor/desempeno}">Volver a mis semestres</a>
    <h1>Informes de desempeño</h1>
    <p class="coord-sub" th:text="${seccion.titulo()}">Asignatura · Semestre</p>

    <p class="vacio" th:if="${#lists.isEmpty(filas)}">No hay estudiantes inscritos en este semestre.</p>
    <table class="coord-tabla" th:unless="${#lists.isEmpty(filas)}">
        <thead><tr><th>Estudiante</th><th>Falta</th><th>Nota sugerida</th><th>Nota final</th><th>Estado</th><th>Acciones</th></tr></thead>
        <tbody>
        <tr th:each="f : ${filas}">
            <td th:text="${f.inscripcion().estudiante()}">Estudiante</td>
            <td th:text="${f.pendientes() == 0} ? 'Nada' : |${f.pendientes()} ítem(s)|">Nada</td>
            <td th:text="${f.sugerida() != null} ? ${f.sugerida().toPlainString().replace('.', ',')} : '—'">—</td>
            <td th:text="${f.informe() != null and f.informe().finalNota() != null} ? ${f.informe().finalNota().toPlainString().replace('.', ',')} : '—'">—</td>
            <td th:switch="${f.estado()}">
                <span class="badge aprobada" th:case="'PUBLICADO'">Publicado</span>
                <span class="badge aprobada" th:case="'VALIDADO'">Nota final fijada</span>
                <span class="badge borrador" th:case="'GENERADO'">Informe generado</span>
                <span class="badge borrador" th:case="'LISTO'">Listo para generar</span>
                <span class="badge pendiente" th:case="*">Faltan notas</span>
            </td>
            <td class="coord-acciones">
                <a class="btn btn-ghost" th:href="@{/profesor/desempeno/{s}/{i}(s=${seccion.id()},i=${f.inscripcion().idInscripcion()})}">Ver informe</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
