<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- dimension(dimension, i, abierta) y criterio(criterio, i, j). Con null se obtiene la fila en blanco. -->
<li class="dimension" th:fragment="dimension(dimension, i, abierta)">
    <details class="dimension__detalle" th:open="${abierta}">
        <summary class="dimension__cab">
            <span class="dimension__numero" th:text="${i + 1}">1</span>
            <span class="dimension__titulo"
                  th:text="${dimension?.nombre != null and !#strings.isEmpty(dimension.nombre) ? dimension.nombre : 'Dimensión sin nombre'}">Dimensión sin nombre</span>
            <span class="dimension__meta"></span>
            <button type="button" class="btn-papelera" data-quitar-dimension aria-label="Quitar dimensión" th:unless="${soloLectura}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
            </button>
        </summary>
        <div class="dimension__cuerpo">
            <div class="campo">
                <label class="campo__control">
                    <span class="campo__etiqueta">Nombre de la dimensión</span>
                    <input type="text" maxlength="200" autocomplete="off" data-campo="nombre" data-validar="texto"
                           data-mensaje="Escribe el nombre de la dimensión."
                           th:name="|dimensiones[${i}].nombre|" th:value="${dimension?.nombre}" th:readonly="${soloLectura}">
                </label>
                <p class="campo__error" role="alert" hidden></p>
            </div>
            <p class="dimension__error" role="alert" hidden>Agrega al menos un criterio a esta dimensión.</p>
            <ul class="criterios">
                <th:block th:each="criterio, c : ${dimension?.criterios}">
                    <th:block th:replace="~{fragments/pauta-editor :: criterio(${criterio}, ${i}, ${c.index})}"></th:block>
                </th:block>
            </ul>
            <button type="button" class="btn btn-secondary" data-agregar-criterio th:unless="${soloLectura}">Agregar criterio</button>
        </div>
    </details>
</li>

<li class="criterio" th:fragment="criterio(criterio, i, j)">
    <div class="campo campo--descripcion">
        <label class="campo__control">
            <span class="campo__etiqueta">Criterio</span>
            <input type="text" maxlength="500" autocomplete="off" data-campo="descripcion" data-validar="texto"
                   data-mensaje="Describe el criterio."
                   th:name="|dimensiones[${i}].criterios[${j}].descripcion|" th:value="${criterio?.descripcion}" th:readonly="${soloLectura}">
        </label>
        <p class="campo__error" role="alert" hidden></p>
    </div>
    <div class="campo campo--puntaje">
        <label class="campo__control">
            <span class="campo__etiqueta">Puntaje máximo</span>
            <input type="text" inputmode="decimal" autocomplete="off" data-campo="puntajeMax" data-validar="puntaje"
                   data-mensaje="Escribe un puntaje mayor que 0, con hasta 2 decimales."
                   th:name="|dimensiones[${i}].criterios[${j}].puntajeMax|" th:value="${criterio?.puntajeMax}" th:readonly="${soloLectura}">
        </label>
        <p class="campo__ayuda">Mayor que 0, con hasta 2 decimales. Puedes usar coma o punto.</p>
        <p class="campo__error" role="alert" hidden></p>
    </div>
    <button type="button" class="btn-papelera" data-quitar-criterio aria-label="Quitar criterio" th:unless="${soloLectura}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
    </button>
</li>

</body>
</html>
